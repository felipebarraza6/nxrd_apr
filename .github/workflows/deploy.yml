# Deploy automático de nxrd_apr a cauce.smartapr.cl por FTP.
#
# Requisitos en GitHub → Settings → Secrets and variables → Actions:
#   Secrets:
#     CAUCE_FTP_PASSWORD    contraseña FTP del usuario cd de cauce.smartapr.cl
#   Variables:
#     CAUCE_FTP_SERVER      servidor FTP (ej: ftp.smartapr.cl)
#     CAUCE_FTP_USERNAME    usuario FTP (ej: cd@cauce.smartapr.cl)
#     CAUCE_FTP_TARGET_DIR  carpeta destino (ej: "/")
#
# El frontend se compila a HTML estático (next.config.ts output:"export") y
# scripts/post-export.mjs genera el .htaccess para las rutas dinámicas.

name: Deploy nxrd_apr a cauce.smartapr.cl

on:
  push:
    branches: [production]
  workflow_dispatch:

concurrency:
  group: deploy-cauce
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # Inyectado en build time: NEXT_PUBLIC_* se sustituye en el bundle.
      NEXT_PUBLIC_YGGDRA_API_BASE: "https://api.yggdra.cl/api"
      # Identificador visible de la versión en la app (Perfil → Aplicación).
      NEXT_PUBLIC_APP_BUILD: "${{ github.run_number }}"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Instalar dependencias
        run: npm ci

      # Mismos gates que el CI de branches: si no pasa, no se despliega.
      - name: Lint
        run: npm run lint

      - name: Generar tipos de rutas
        run: npx next typegen

      - name: Type-check
        run: npm run type-check

      - name: Build estático
        run: npm run build

      - name: Generar .htaccess para rutas dinámicas
        run: node scripts/post-export.mjs

      - name: Subir a cauce.smartapr.cl por FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ vars.CAUCE_FTP_SERVER }}
          port: 21
          username: ${{ vars.CAUCE_FTP_USERNAME }}
          password: ${{ secrets.CAUCE_FTP_PASSWORD }}
          local-dir: out/
          server-dir: ${{ vars.CAUCE_FTP_TARGET_DIR }}
          # Sin dangerous-clean-slate: la raíz del hosting contiene .well-known/
          # (renovación SSL) que no debe borrarse.
